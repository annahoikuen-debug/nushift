name: Tests

# REGRESSION_TEST_PLAN.md §4.2（PRゲート）と §4.4（main の定期実行）の実装。
# PR: lint + test-fast を必須ゲートにする。main push では同じ内容を再確認する。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Run fast tests
        run: python -m pytest -m "not slow" -q

  test-slow:
    # slow（CBC 統合）テストは 1 台だけで夜間・手動に実行する。
    # PR ゲートには入れない（CBC の 7 日問題は 3〜4 分かかる）。
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run slow tests
        run: python -m pytest -m "slow" -q
